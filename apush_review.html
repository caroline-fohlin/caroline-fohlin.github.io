const allCards = [
  { id: 1, category: "Period 1 (1491–1607)", term: "Columbian Exchange", definition: "The transfer of plants, animals, diseases, people, and ideas between the Americas and the Old World following Columbus's 1492 voyage. Devastated Native populations via smallpox; transformed European diets with maize and potatoes." },
  { id: 2, category: "Period 1 (1491–1607)", term: "Encomienda system", definition: "Spanish labor system granting conquistadors the right to demand tribute and forced labor from Native peoples in exchange for supposed protection and Christian instruction. Led to mass exploitation and depopulation." },
  { id: 3, category: "Period 1 (1491–1607)", term: "Bartolomé de las Casas", definition: "Spanish priest who became a fierce critic of the encomienda system and advocated for Native rights. His writings (Brevísima relación) influenced the New Laws of 1542, which tried to limit Native enslavement." },
  { id: 4, category: "Period 1 (1491–1607)", term: "Pueblo peoples", definition: "Indigenous agricultural societies of the Southwest (Hopi, Zuni, Acoma) who built multi-story stone and adobe communities and developed sophisticated irrigation. Later resisted Spanish colonization in the Pueblo Revolt (1680)." },
  { id: 5, category: "Period 1 (1491–1607)", term: "Iroquois Confederacy (Haudenosaunee)", definition: "Alliance of five (later six) nations—Mohawk, Onondaga, Cayuga, Oneida, Seneca, and later Tuscarora—with a democratic Great Law of Peace that some historians argue influenced the U.S. Constitution." },
  { id: 6, category: "Period 1 (1491–1607)", term: "Spanish mission system", definition: "Network of Catholic missions used to convert and control Native peoples in Spanish borderlands (Florida, New Mexico, California). Missions disrupted Native cultures and economies while creating a mixed colonial society." },
  { id: 7, category: "Period 1 (1491–1607)", term: "Treaty of Tordesillas (1494)", definition: "Agreement between Spain and Portugal dividing the non-European world along a meridian west of the Cape Verde Islands, granting Spain rights to most of the Americas and Portugal to Africa and Asia." },
  { id: 8, category: "Period 1 (1491–1607)", term: "Protestant Reformation", definition: "16th-century religious reform movement challenging Catholic Church authority, sparked by Martin Luther (1517). Created religious diversity in Europe and motivated some migration to the Americas—particularly Puritans to New England." },
  { id: 9, category: "Period 2 (1607–1754)", term: "Headright system", definition: "Virginia land-grant policy giving 50 acres to anyone who paid for another person's Atlantic passage. Incentivized importation of indentured servants and, later, enslaved Africans; concentrated land in wealthy planters' hands." },
  { id: 10, category: "Period 2 (1607–1754)", term: "Indentured servitude", definition: "Labor system in which workers contracted to serve a master for 4–7 years in exchange for passage to the colonies. Declined after Bacon's Rebellion (1676) as planters shifted to African slave labor." },
  { id: 11, category: "Period 2 (1607–1754)", term: "Bacon's Rebellion (1676)", definition: "Uprising led by Nathaniel Bacon against Virginia's Governor Berkeley. Frontier settlers (including freed servants) attacked Native peoples and then the colonial government. Alarmed planters then shifted to African slavery as a more controllable labor force." },
  { id: 12, category: "Period 2 (1607–1754)", term: "Salutary neglect", definition: "Informal British policy (early 1700s) of loosely enforcing trade laws in the colonies, allowing colonial assemblies to develop significant autonomy. Its end after 1763 triggered colonial protests." },
  { id: 13, category: "Period 2 (1607–1754)", term: "Mayflower Compact (1620)", definition: "First self-governing agreement in the colonies, signed by Pilgrim men before landing at Plymouth. Established the principle of majority rule and governance by consent—a precedent for American democratic practice." },
  { id: 14, category: "Period 2 (1607–1754)", term: "Puritan 'City upon a Hill'", definition: "John Winthrop's 1630 vision of Massachusetts Bay Colony as a model godly society watched by the world. Expressed the idea of American exceptionalism and moral mission that recurs throughout U.S. history." },
  { id: 15, category: "Period 2 (1607–1754)", term: "Half-Way Covenant (1662)", definition: "Puritan compromise allowing partial church membership (but not full communion) for the unconverted children of members. Reflected declining religious zeal and debates over who belonged to the Puritan community." },
  { id: 16, category: "Period 2 (1607–1754)", term: "Navigation Acts (1651–1673)", definition: "English mercantilist laws requiring colonial trade to flow through England in English ships, benefiting British merchants and the crown. Widely evaded; their enforcement after 1763 angered colonists." },
  { id: 17, category: "Period 2 (1607–1754)", term: "Middle Passage", definition: "The brutal Atlantic crossing of slave ships from Africa to the Americas. Enslaved Africans were packed in horrific conditions; an estimated 15–20% died during the voyage. Central to the transatlantic slave trade system." },
  { id: 18, category: "Period 2 (1607–1754)", term: "First Great Awakening", definition: "Religious revival of the 1730s–40s (Jonathan Edwards, George Whitefield) emphasizing emotional conversion and individual relationship with God. Challenged church hierarchies and created democratic religious culture; increased colonial unity." },
  { id: 19, category: "Period 2 (1607–1754)", term: "Triangular trade", definition: "Transatlantic trade network exchanging manufactured goods (Europe) → enslaved people (Africa) → raw materials like tobacco and sugar (Americas) → back to Europe. Enriched European merchants while exploiting African and colonial labor." },
  { id: 20, category: "Period 2 (1607–1754)", term: "Stono Rebellion (1739)", definition: "Largest slave uprising in colonial America, near Charleston, SC. Enslaved people marched toward Spanish Florida, killing ~20 whites. Led to South Carolina's harsher Negro Act (1740) restricting slave gatherings and literacy." },
  { id: 21, category: "Period 3 (1754–1800)", term: "French and Indian War (1754–1763)", definition: "North American theater of the Seven Years' War; Britain and colonists vs. France and Native allies. Britain won Canada and territory east of the Mississippi but accumulated massive debt, prompting new taxation of colonists." },
  { id: 22, category: "Period 3 (1754–1800)", term: "Proclamation of 1763", definition: "Royal decree forbidding colonial settlement west of the Appalachian Mountains to prevent conflict with Native peoples. Outraged land-hungry colonists who saw it as British tyranny over their westward ambitions." },
  { id: 23, category: "Period 3 (1754–1800)", term: "Virtual vs. actual representation", definition: "British argument that Parliament virtually represented all subjects (including colonists) vs. colonial argument that they could only be taxed by assemblies they actually elected. Core constitutional dispute behind 'no taxation without representation.'" },
  { id: 24, category: "Period 3 (1754–1800)", term: "Common Sense (1776)", definition: "Thomas Paine's pamphlet arguing in plain language for American independence and republican government. Sold 500,000 copies; shifted public opinion decisively toward independence by framing monarchy as irrational tyranny." },
  { id: 25, category: "Period 3 (1754–1800)", term: "Articles of Confederation (1781)", definition: "First U.S. constitution creating a weak central government with no power to tax, regulate commerce, or enforce laws. Failures (Shays' Rebellion, economic chaos) demonstrated the need for the Constitution." },
  { id: 26, category: "Period 3 (1754–1800)", term: "Shays' Rebellion (1786–87)", definition: "Armed uprising by Massachusetts farmers protesting debt foreclosures under the weak Confederation government. Alarmed elites and provided key impetus for the Constitutional Convention in 1787." },
  { id: 27, category: "Period 3 (1754–1800)", term: "3/5 Compromise", definition: "Constitutional agreement counting enslaved persons as 3/5 of a person for apportionment of representation and direct taxes. Gave slave states disproportionate political power in Congress and the Electoral College." },
  { id: 28, category: "Period 3 (1754–1800)", term: "Federalist No. 10 (Madison)", definition: "Essay arguing a large republic would control factions better than small democracies by making it harder for any single faction to dominate. Key defense of the Constitution and theory of pluralist republican government." },
  { id: 29, category: "Period 3 (1754–1800)", term: "Bill of Rights (1791)", definition: "First ten amendments to the Constitution guaranteeing individual liberties (speech, religion, press, assembly, due process, etc.). Added to secure ratification by Anti-Federalists who feared a powerful central government." },
  { id: 30, category: "Period 3 (1754–1800)", term: "Hamilton's financial program", definition: "Treasury Secretary Hamilton's plan: assume state debts, create a national bank, tariffs to protect industry, excise taxes. Strengthened federal government but sparked opposition from Jefferson/Madison who founded the Democratic-Republican Party." },
  { id: 31, category: "Period 3 (1754–1800)", term: "Alien and Sedition Acts (1798)", definition: "Federalist laws extending the residency requirement for citizenship and criminalizing criticism of the government. Jefferson and Madison responded with the Virginia and Kentucky Resolutions asserting states' rights to nullify federal law." },
  { id: 32, category: "Period 4 (1800–1848)", term: "Revolution of 1800", definition: "Jefferson's peaceful transfer of power from Federalists to Democratic-Republicans—first peaceful transfer between opposing parties in U.S. history. Jefferson called it a revolution restoring republican principles against Federalist 'monarchism.'" },
  { id: 33, category: "Period 4 (1800–1848)", term: "Marbury v. Madison (1803)", definition: "Chief Justice Marshall's ruling establishing judicial review—the Supreme Court's power to strike down unconstitutional laws. Cornerstone of American constitutional law and a dramatic assertion of judicial power." },
  { id: 34, category: "Period 4 (1800–1848)", term: "Louisiana Purchase (1803)", definition: "Jefferson bought 828,000 sq. miles from Napoleon for $15 million, doubling the U.S. Jefferson struggled with this constitutionally (no explicit power to purchase territory) but proceeded; Lewis & Clark followed." },
  { id: 35, category: "Period 4 (1800–1848)", term: "Market revolution", definition: "1820s–1840s transformation of the U.S. economy through manufacturing, transportation (canals, railroads), and commercial agriculture. Created a national market, middle class, and wage-labor system; reshaped family and gender roles." },
  { id: 36, category: "Period 4 (1800–1848)", term: "Missouri Compromise (1820)", definition: "Admitted Missouri (slave) and Maine (free); banned slavery north of 36°30' in the Louisiana Territory. Temporarily resolved the sectional crisis over slavery's expansion; called by Jefferson 'a fire bell in the night.'" },
  { id: 37, category: "Period 4 (1800–1848)", term: "Monroe Doctrine (1823)", definition: "Declared the Western Hemisphere closed to further European colonization and U.S. non-interference in European affairs. Asserted U.S. dominance in the Americas; became cornerstone of American foreign policy." },
  { id: 38, category: "Period 4 (1800–1848)", term: "Second Great Awakening", definition: "Religious revival (c. 1800–1840s) emphasizing free will and perfectibility of humanity. Fueled reform movements—abolitionism, temperance, women's rights, public education—by inspiring moral responsibility to improve society." },
  { id: 39, category: "Period 4 (1800–1848)", term: "Nullification Crisis (1832–33)", definition: "South Carolina declared federal tariffs (1828, 1832) null and void within the state. Jackson threatened force; the crisis was resolved by a compromise tariff. Intensified sectional tensions over states' rights." },
  { id: 40, category: "Period 4 (1800–1848)", term: "Indian Removal Act (1830)", definition: "Law authorizing forced relocation of Native peoples east of the Mississippi to 'Indian Territory.' Led to the Trail of Tears (1838–39), in which thousands of Cherokee died during forced migration." },
  { id: 41, category: "Period 4 (1800–1848)", term: "Manifest Destiny", definition: "Belief that U.S. expansion across the continent was divinely ordained and inevitable. Justified westward expansion, displacement of Native peoples, war with Mexico (1846–48), and acquisition of Texas, Oregon, California." },
  { id: 42, category: "Period 4 (1800–1848)", term: "Seneca Falls Convention (1848)", definition: "First women's rights convention; issued Declaration of Sentiments modeled on the Declaration of Independence, declaring 'all men and women are created equal' and demanding voting rights and legal equality." },
  { id: 43, category: "Period 4 (1800–1848)", term: "Cult of Domesticity", definition: "Ideology defining middle-class women's sphere as the home—piety, purity, domesticity, and submissiveness. Excluded women from public life but also gave women moral authority and enabled women's reform activism." },
  { id: 44, category: "Period 5 (1844–1877)", term: "Wilmot Proviso (1846)", definition: "Congressional proposal to ban slavery from any territory acquired from Mexico. Passed the House but failed in the Senate; intensified sectional conflict by forcing a vote that realigned political parties along North/South lines." },
  { id: 45, category: "Period 5 (1844–1877)", term: "Compromise of 1850", definition: "Henry Clay's five-part deal: admitted California as free, organized New Mexico/Utah by popular sovereignty, banned DC slave trade, strengthened Fugitive Slave Act, settled TX boundary. Postponed, but didn't prevent, secession." },
  { id: 46, category: "Period 5 (1844–1877)", term: "Kansas-Nebraska Act (1854)", definition: "Created Kansas and Nebraska territories with popular sovereignty on slavery—repealing the Missouri Compromise. 'Bleeding Kansas' violence, collapse of Whigs, and rise of the Republican Party followed." },
  { id: 47, category: "Period 5 (1844–1877)", term: "Dred Scott v. Sandford (1857)", definition: "Supreme Court ruled enslaved people were not citizens and had no right to sue; Congress had no power to ban slavery in territories (Missouri Compromise unconstitutional). Outraged the North and boosted Republican Party." },
  { id: 48, category: "Period 5 (1844–1877)", term: "Emancipation Proclamation (1863)", definition: "Executive order freeing enslaved people in Confederate states still in rebellion. Did not free slaves in border states; reframed the war as a moral crusade against slavery and prevented European recognition of the Confederacy." },
  { id: 49, category: "Period 5 (1844–1877)", term: "13th, 14th, 15th Amendments", definition: "Reconstruction amendments: 13th abolished slavery (1865); 14th granted citizenship and equal protection (1868); 15th guaranteed Black men's voting rights (1870). Together transformed constitutional law but were undermined by Jim Crow." },
  { id: 50, category: "Period 5 (1844–1877)", term: "Radical Reconstruction", definition: "Congressional Reconstruction program (1867–77) placing Southern states under military rule, requiring Black male suffrage, and ratification of 14th Amendment for readmission. Created biracial governments and freedmen's political participation." },
  { id: 51, category: "Period 5 (1844–1877)", term: "Freedmen's Bureau (1865)", definition: "Federal agency providing food, shelter, medical care, and education to freed people and poor whites in the postwar South. Established hundreds of schools; undermined by Johnson's vetoes and lack of land redistribution." },
  { id: 52, category: "Period 5 (1844–1877)", term: "Sharecropping", definition: "Post-Civil War labor system where freedpeople and poor whites farmed land in exchange for a share of the crop. Debt peonage kept sharecroppers in a cycle of poverty economically similar to slavery." },
  { id: 53, category: "Period 5 (1844–1877)", term: "Compromise of 1877", definition: "Informal deal ending the disputed 1876 presidential election: Hayes became president in exchange for withdrawing federal troops from the South. Effectively ended Reconstruction and enabled the rise of Jim Crow." },
  { id: 54, category: "Period 5 (1844–1877)", term: "King Cotton diplomacy", definition: "Confederate strategy of withholding cotton exports to force Britain and France to recognize the Confederacy. Failed because European nations found alternative cotton sources and opposed slavery after the Emancipation Proclamation." },
  { id: 55, category: "Period 6 (1865–1898)", term: "Gilded Age", definition: "Mark Twain's term for the late 1800s era of rapid industrialization, extreme wealth inequality, political corruption, and laissez-faire capitalism. Period of massive corporate growth (Rockefeller, Carnegie, Vanderbilt) alongside poverty." },
  { id: 56, category: "Period 6 (1865–1898)", term: "Social Darwinism", definition: "Application of Darwin's 'survival of the fittest' to human society; used to justify wealth inequality, oppose social welfare programs, and support imperialism. Associated with Herbert Spencer and Andrew Carnegie's 'Gospel of Wealth.'" },
  { id: 57, category: "Period 6 (1865–1898)", term: "Vertical vs. horizontal integration", definition: "Vertical integration: controlling all stages of production (Carnegie's steel). Horizontal integration: merging competing firms into a monopoly (Rockefeller's Standard Oil trust). Both concentrated economic power and crushed competition." },
  { id: 58, category: "Period 6 (1865–1898)", term: "Homestead Act (1862)", definition: "Granted 160 acres of public land to settlers who farmed it for 5 years. Encouraged westward migration of 400,000+ families but benefited land speculators more than small farmers; accelerated displacement of Native peoples." },
  { id: 59, category: "Period 6 (1865–1898)", term: "Dawes Act (1887)", definition: "Divided tribal lands into individual allotments (160 acres/family) to assimilate Native Americans into yeoman farming. Destroyed tribal sovereignty; Native peoples lost ~90 million acres by 1934 as 'surplus' land was sold to whites." },
  { id: 60, category: "Period 6 (1865–1898)", term: "New Immigration (1880s–1920s)", definition: "Large wave of immigrants from Southern and Eastern Europe (Italians, Poles, Russians, Jews) and Asia. Differed culturally and religiously from earlier Northwestern European immigrants; faced nativist hostility and discrimination." },
  { id: 61, category: "Period 6 (1865–1898)", term: "Chinese Exclusion Act (1882)", definition: "First federal law to restrict immigration based on race/nationality; barred Chinese laborers from entering the U.S. Reflected nativist fears of labor competition and racial prejudice; not repealed until 1943." },
  { id: 62, category: "Period 6 (1865–1898)", term: "Populist (People's) Party", definition: "1890s agrarian reform party representing indebted farmers. Platform: graduated income tax, government ownership of railroads, direct election of senators, silver coinage (inflation). Bryan's 1896 defeat ended Populism as a party." },
  { id: 63, category: "Period 6 (1865–1898)", term: "Jim Crow laws", definition: "State and local laws in the post-Reconstruction South mandating racial segregation in public facilities, transportation, schools. Enforced by violence and upheld by Plessy v. Ferguson (1896)'s 'separate but equal' doctrine." },
  { id: 64, category: "Period 6 (1865–1898)", term: "Plessy v. Ferguson (1896)", definition: "Supreme Court upheld racial segregation under 'separate but equal' doctrine. Provided constitutional cover for Jim Crow for 58 years until Brown v. Board of Education (1954)." },
  { id: 65, category: "Period 6 (1865–1898)", term: "Frontier Thesis (Frederick Jackson Turner, 1893)", definition: "Argument that the frontier experience forged unique American democratic character and individualism. Presented with concern since the 1890 census declared the frontier 'closed'—implying a crisis for American identity." },
  { id: 66, category: "Period 7 (1898–1945)", term: "Yellow journalism", definition: "Sensationalist newspaper reporting (Hearst's NY Journal, Pulitzer's NY World) that exaggerated Spanish atrocities in Cuba, inflaming public opinion and helping push the U.S. into the Spanish-American War (1898)." },
  { id: 67, category: "Period 7 (1898–1945)", term: "Roosevelt Corollary (1904)", definition: "Extension of Monroe Doctrine asserting U.S. right to intervene in Latin American nations unable to maintain 'order' or pay debts. Justified numerous U.S. military interventions in the Caribbean ('Big Stick' diplomacy)." },
  { id: 68, category: "Period 7 (1898–1945)", term: "Progressive Era reforms", definition: "Early 1900s movement addressing industrial capitalism's abuses: antitrust legislation (Sherman Act enforcement), women's suffrage, Prohibition, direct democracy (initiative, referendum, recall), direct election of senators (17th Amendment)." },
  { id: 69, category: "Period 7 (1898–1945)", term: "Muckrakers", definition: "Progressive Era investigative journalists exposing corruption and social problems. Upton Sinclair (The Jungle—meatpacking), Ida Tarbell (Standard Oil monopoly), Jacob Riis (urban poverty) prompted public outrage and reform legislation." },
  { id: 70, category: "Period 7 (1898–1945)", term: "19th Amendment (1920)", definition: "Granted women the right to vote, culminating a 72-year suffrage campaign. Result of activism by NAWSA (Carrie Chapman Catt) and more militant tactics of the National Woman's Party (Alice Paul)." },
  { id: 71, category: "Period 7 (1898–1945)", term: "Great Migration (1910–1970)", definition: "Movement of ~6 million Black Americans from the rural South to Northern and Western cities seeking industrial jobs and escape from Jim Crow. Transformed Black political power, culture (Harlem Renaissance), and Northern urban demographics." },
  { id: 72, category: "Period 7 (1898–1945)", term: "Red Scare (1919–1920)", definition: "First Red Scare: fears of communist revolution following WWI and Russian Revolution. Palmer Raids arrested thousands of suspected radicals, many deported. Reflected nativist fears and anti-labor hostility." },
  { id: 73, category: "Period 7 (1898–1945)", term: "Harlem Renaissance", definition: "Cultural flowering of African American literature, art, and music in 1920s Harlem. Langston Hughes, Zora Neale Hurston, Duke Ellington. Expressed Black identity and pride; challenged racial stereotypes but didn't end discrimination." },
  { id: 74, category: "Period 7 (1898–1945)", term: "Scopes Trial (1925)", definition: "Tennessee teacher John Scopes tried for teaching evolution; prosecution by William Jennings Bryan, defense by Clarence Darrow. Symbolized 1920s cultural conflict between modernism and religious fundamentalism." },
  { id: 75, category: "Period 7 (1898–1945)", term: "New Deal (1933–1938)", definition: "FDR's response to the Great Depression: relief (FERA), recovery (AAA, NRA), and reform (FDIC, SEC, Social Security, Wagner Act). Expanded federal government's role in the economy but did not fully end the Depression." },
  { id: 76, category: "Period 7 (1898–1945)", term: "Social Security Act (1935)", definition: "Created federal old-age pension, unemployment insurance, and aid to dependent children. Cornerstone of the modern welfare state; initially excluded agricultural and domestic workers (disproportionately Black)." },
  { id: 77, category: "Period 7 (1898–1945)", term: "Wagner Act (1935)", definition: "National Labor Relations Act guaranteeing workers' rights to unionize and bargain collectively; created NLRB. Led to explosive growth of CIO industrial unions and established framework of modern labor-management relations." },
  { id: 78, category: "Period 7 (1898–1945)", term: "Internment of Japanese Americans (1942)", definition: "Executive Order 9066 sent 120,000 Japanese Americans (2/3 were citizens) to internment camps during WWII out of wartime hysteria and racial prejudice. Upheld by Korematsu v. U.S. (1944); U.S. formally apologized in 1988." },
  { id: 79, category: "Period 7 (1898–1945)", term: "Neutrality Acts (1935–37)", definition: "Laws reflecting American isolationism: banned arms sales and loans to belligerents, barred Americans from traveling on belligerent ships. Gradually weakened as FDR moved toward aiding Britain (Lend-Lease, 1941)." },
  { id: 80, category: "Period 7 (1898–1945)", term: "Isolationism", definition: "U.S. foreign policy tradition of avoiding permanent alliances and European conflicts. Strong in the 1930s (America First movement); ended by Pearl Harbor (1941). Associated with fear of the 'merchants of death' and WWI disillusionment." },
  { id: 81, category: "Period 8 (1945–1980)", term: "Containment (Truman Doctrine)", definition: "George Kennan's strategy of preventing Soviet communism from spreading beyond its existing boundaries. Truman Doctrine (1947) extended aid to Greece/Turkey; became the framework for U.S. Cold War policy for 40 years." },
  { id: 82, category: "Period 8 (1945–1980)", term: "Marshall Plan (1948)", definition: "$13 billion U.S. aid program to rebuild Western European economies after WWII. Aimed to prevent communism from exploiting poverty; succeeded in stabilizing Western democracies and creating postwar economic boom." },
  { id: 83, category: "Period 8 (1945–1980)", term: "McCarthyism", definition: "Senator Joseph McCarthy's anti-communist campaign (1950–54) using reckless accusations, guilt by association, and blacklisting. Senate Army hearings (1954) exposed his tactics; he was censured. Symbol of anti-communist hysteria." },
  { id: 84, category: "Period 8 (1945–1980)", term: "Korean War (1950–53)", definition: "First 'hot' war of the Cold War era. U.S. led UN forces defended South Korea from North Korean/Chinese invasion; ended in armistice restoring pre-war border. Called the 'Forgotten War'; set precedent for limited war." },
  { id: 85, category: "Period 8 (1945–1980)", term: "Brown v. Board of Education (1954)", definition: "Unanimous Supreme Court decision overturning Plessy v. Ferguson, declaring racial segregation in public schools unconstitutional. Warren Court ruled 'separate but equal' inherently unequal; sparked the civil rights movement." },
  { id: 86, category: "Period 8 (1945–1980)", term: "Massive Retaliation / Eisenhower Doctrine", definition: "Eisenhower's 'New Look' defense policy threatening nuclear retaliation against Soviet aggression; cheaper than conventional forces ('more bang for the buck'). Eisenhower also warned of the 'military-industrial complex' in his farewell address." },
  { id: 87, category: "Period 8 (1945–1980)", term: "Montgomery Bus Boycott (1955–56)", definition: "381-day boycott by Black residents of Montgomery, AL, after Rosa Parks's arrest. Led by Martin Luther King Jr.; ended with Supreme Court ruling bus segregation unconstitutional. Launched the nonviolent direct action civil rights movement." },
  { id: 88, category: "Period 8 (1945–1980)", term: "Civil Rights Act of 1964", definition: "Banned discrimination based on race, color, religion, sex, or national origin in employment and public accommodations. Created EEOC to enforce anti-discrimination law. LBJ's signature achievement after JFK's assassination." },
  { id: 89, category: "Period 8 (1945–1980)", term: "Voting Rights Act of 1965", definition: "Outlawed discriminatory voting practices (literacy tests, poll taxes) that had disenfranchised Black voters. Followed Bloody Sunday (Selma march). Dramatically increased Black voter registration across the South." },
  { id: 90, category: "Period 8 (1945–1980)", term: "Great Society", definition: "LBJ's ambitious domestic program: Medicare/Medicaid, Elementary and Secondary Education Act, Voting Rights Act, Immigration Act (1965), War on Poverty. Expanded the federal government's role more than any program since the New Deal." },
  { id: 91, category: "Period 8 (1945–1980)", term: "Gulf of Tonkin Resolution (1964)", definition: "Congressional authorization (based on disputed attack on U.S. ships) giving LBJ broad authority to escalate U.S. military involvement in Vietnam without a formal declaration of war. Used to justify massive troop deployments." },
  { id: 92, category: "Period 8 (1945–1980)", term: "Tet Offensive (1968)", definition: "Massive coordinated Viet Cong/NVA assault on South Vietnamese cities during Tet holiday. Military setback for North Vietnam but propaganda victory; shattered American public confidence in the war and led LBJ not to seek reelection." },
  { id: 93, category: "Period 8 (1945–1980)", term: "Nixon's détente and opening to China", definition: "Nixon/Kissinger's realpolitik: relaxed Cold War tensions through strategic arms limitation (SALT I, 1972), Nixon's historic visit to China (1972), and diplomatic recognition of communist China. Triangular diplomacy against USSR." },
  { id: 94, category: "Period 8 (1945–1980)", term: "Watergate (1972–74)", definition: "Break-in at Democratic headquarters, Nixon's cover-up and obstruction, Saturday Night Massacre. Nixon resigned in August 1974—only president to do so. Produced deep public distrust of government; War Powers Act (1973) followed." },
  { id: 95, category: "Period 8 (1945–1980)", term: "Second-wave feminism", definition: "1960s–70s women's movement expanding beyond suffrage to tackle workplace discrimination, reproductive rights, domestic violence, and sexual harassment. NOW founded (1966); ERA failed; but Title IX (1972) and Roe v. Wade (1973) passed." },
  { id: 96, category: "Period 8 (1945–1980)", term: "Warren Court & judicial activism", definition: "Earl Warren's Supreme Court (1953–69) expanded civil liberties and civil rights: Brown (1954), Mapp v. Ohio, Gideon v. Wainwright, Miranda v. Arizona. Sparked conservative backlash and debate over judicial interpretation." },
  { id: 97, category: "Period 9 (1980–Present)", term: "Reagan Revolution / Reaganomics", definition: "Reagan's supply-side economics ('trickle-down'): massive tax cuts (top rate 70%→28%), deregulation, reduced social spending, anti-union stance (firing PATCO strikers). Increased defense spending; tripled national debt; widened inequality." },

// ─────────────────────────────────────────────
//  FLASHCARD MODE
// ─────────────────────────────────────────────
function FlashcardMode() {
  const [selectedCategory, setSelectedCategory] = useState("All");
  const [deck, setDeck] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [direction, setDirection] = useState("term");
  const [progress, setProgress] = useState({});
  const [shuffled, setShuffled] = useState(true);

  const buildDeck = useCallback(() => {
    let cards = selectedCategory === "All" ? [...allCards] : allCards.filter(c => c.category === selectedCategory);
    if (shuffled) for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
    setDeck(cards); setCurrentIndex(0); setFlipped(false);
  }, [selectedCategory, shuffled]);

  useEffect(() => { buildDeck(); }, [buildDeck]);

  const current = deck[currentIndex];
  const accentColor = current ? getPeriodColor(current.category) : "#8a7040";

  const navigate = (dir) => {
    setFlipped(false);
    setTimeout(() => { if (dir === "next") setCurrentIndex(i => Math.min(i + 1, deck.length - 1)); else setCurrentIndex(i => Math.max(i - 1, 0)); }, 80);
  };
  const markCard = (status) => { if (current) setProgress(p => ({ ...p, [current.id]: status })); };

  useEffect(() => {
    const h = (e) => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); setFlipped(f => !f); }
      if (e.key === "ArrowRight") navigate("next");
      if (e.key === "ArrowLeft") navigate("prev");
      if (e.key === "1") markCard("known");
      if (e.key === "2") markCard("learning");
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [deck, currentIndex]);

  const known = Object.values(progress).filter(v => v === "known").length;
  const learning = Object.values(progress).filter(v => v === "learning").length;
  const total = allCards.length;
  const pct = Math.round((known / total) * 100);

  return (
    <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>
      {/* SIDEBAR */}
      <div style={{ width: 220, flexShrink: 0, borderRight: "1px solid rgba(255,255,255,0.05)", background: "#0a0a0b", display: "flex", flexDirection: "column", overflowY: "auto" }}>
        <div style={{ padding: "14px 12px 8px" }}>
          <div style={{ padding: "12px", background: "rgba(255,255,255,0.03)", borderRadius: 8, marginBottom: 12, border: "1px solid rgba(255,255,255,0.05)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#5a5040" }}>MASTERY</span>
              <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 16, color: "#e8c060", letterSpacing: "0.05em" }}>{pct}%</span>
            </div>
            <div className="progress-track" style={{ marginBottom: 6 }}>
              <div className="progress-fill" style={{ width: `${pct}%`, background: "linear-gradient(90deg, #8a6020, #e8c060)" }} />
            </div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: "#4a4030", display: "flex", gap: 10 }}>
              <span style={{ color: "#5a9a5a" }}>✓ {known}</span>
              <span style={{ color: "#9a6a30" }}>⟳ {learning}</span>
              <span>/ {total}</span>
            </div>
          </div>
        </div>
        <div style={{ padding: "0 6px 12px", flex: 1 }}>
          <button className={`sidebar-btn ${selectedCategory === "All" ? "active" : ""}`} onClick={() => setSelectedCategory("All")}>
            <span>All Categories</span><span style={{ fontSize: 10, opacity: 0.5 }}>{allCards.length}</span>
          </button>
          {["Period 1 (1491–1607)","Period 2 (1607–1754)","Period 3 (1754–1800)","Period 4 (1800–1848)","Period 5 (1844–1877)","Period 6 (1865–1898)","Period 7 (1898–1945)","Period 8 (1945–1980)","Period 9 (1980–Present)"].map(cat => (
            <button key={cat} className={`sidebar-btn ${selectedCategory === cat ? "active" : ""}`} onClick={() => setSelectedCategory(cat)}>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: getPeriodColor(cat), flexShrink: 0 }} />
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{cat}</span>
              </span>
              <span style={{ fontSize: 10, opacity: 0.5, flexShrink: 0 }}>{allCards.filter(c => c.category === cat).length}</span>
            </button>
          ))}
          <div style={{ height: 1, background: "rgba(255,255,255,0.05)", margin: "6px 6px" }} />
          {["Key Themes & Concepts","Key Documents & Speeches"].map(cat => (
            <button key={cat} className={`sidebar-btn ${selectedCategory === cat ? "active" : ""}`} onClick={() => setSelectedCategory(cat)}>
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{cat}</span>
              <span style={{ fontSize: 10, opacity: 0.5, flexShrink: 0 }}>{allCards.filter(c => c.category === cat).length}</span>
            </button>
          ))}
        </div>
      </div>

      {/* FLASHCARD MAIN */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "24px 48px", gap: 18, overflow: "hidden" }}>
        {/* top controls */}
        <div style={{ display: "flex", alignItems: "center", gap: 16, width: "100%", maxWidth: 700 }}>
          <label className="radio-label"><input type="radio" name="fcdir" value="term" checked={direction === "term"} onChange={() => setDirection("term")} />Term → Def</label>
          <label className="radio-label"><input type="radio" name="fcdir" value="def" checked={direction === "def"} onChange={() => setDirection("def")} />Def → Term</label>
          <label style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#7a7060", cursor: "pointer" }}>
            <input type="checkbox" checked={shuffled} onChange={e => setShuffled(e.target.checked)} style={{ accentColor: "#c8a050" }} />Shuffle
          </label>
          <button onClick={buildDeck} style={{ all: "unset", cursor: "pointer", padding: "5px 14px", borderRadius: 6, background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#8a8070" }}>↺ Restart</button>
        </div>

        {current ? (
          <>
            <div style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", maxWidth: 700 }}>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#4a4838" }}>
                <span style={{ color: "#c8b060", fontWeight: 500 }}>{currentIndex + 1}</span><span> / {deck.length}</span>
              </div>
              <div style={{ flex: 1 }}>
                <div className="progress-track">
                  <div className="progress-fill" style={{ width: `${((currentIndex + 1) / deck.length) * 100}%`, background: `linear-gradient(90deg, ${accentColor}88, ${accentColor})` }} />
                </div>
              </div>
              {progress[current.id] && (
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, padding: "3px 10px", borderRadius: 100, background: progress[current.id] === "known" ? "rgba(60,130,60,0.15)" : "rgba(180,110,20,0.15)", color: progress[current.id] === "known" ? "#6ab86a" : "#c08030", border: `1px solid ${progress[current.id] === "known" ? "rgba(60,130,60,0.3)" : "rgba(180,110,20,0.3)"}` }}>
                  {progress[current.id] === "known" ? "✓ Known" : "⟳ Learning"}
                </div>
              )}
            </div>

            <div className="card-scene" onClick={() => setFlipped(f => !f)}>
              <div className={`card-body ${flipped ? "flipped" : ""}`}>
                <div className="card-side card-front-face" style={{ borderTop: `3px solid ${accentColor}50` }}>
                  <span className="cat-chip" style={{ background: `${accentColor}22`, color: accentColor, border: `1px solid ${accentColor}44`, marginBottom: 20 }}>{current.category}</span>
                  <div style={{ fontFamily: "'Libre Baskerville', Georgia, serif", fontSize: direction === "term" ? 30 : 16, fontWeight: direction === "term" ? 700 : 400, fontStyle: direction === "term" ? "normal" : "italic", color: "#f0e8c8", lineHeight: 1.4, maxWidth: 540 }}>
                    {direction === "term" ? current.term : current.definition}
                  </div>
                  <div style={{ marginTop: 22, fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: "#3a3830", letterSpacing: "0.08em", textTransform: "uppercase" }}>Space · Enter to flip</div>
                </div>
                <div className="card-side card-back-face" style={{ borderTop: `3px solid ${accentColor}30` }}>
                  <div style={{ fontFamily: direction === "def" ? "'Libre Baskerville', Georgia, serif" : "'DM Sans', sans-serif", fontSize: direction === "def" ? 26 : 15, fontWeight: direction === "def" ? 700 : 400, color: "#c8d8c0", lineHeight: 1.6, maxWidth: 560, textAlign: "center" }}>
                    {direction === "term" ? current.definition : current.term}
                  </div>
                </div>
              </div>
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <button className="nav-btn" onClick={() => navigate("prev")} disabled={currentIndex === 0}>‹</button>
              <button className="ctrl-btn" onClick={() => markCard("learning")} style={{ background: "rgba(180,110,20,0.12)", border: "1px solid rgba(180,110,20,0.25)", color: "#c08030" }}>⟳ Still Learning</button>
              <button className="ctrl-btn" onClick={() => markCard("known")} style={{ background: "rgba(60,130,60,0.12)", border: "1px solid rgba(60,130,60,0.25)", color: "#6ab86a" }}>✓ I Know This</button>
              <button className="nav-btn" onClick={() => navigate("next")} disabled={currentIndex === deck.length - 1}>›</button>
            </div>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: "#2e2c28", letterSpacing: "0.07em", textTransform: "uppercase" }}>← → Navigate · 1 = Known · 2 = Learning</div>
          </>
        ) : <div style={{ color: "#4a4030", fontFamily: "'DM Sans', sans-serif" }}>No cards found.</div>}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
//  QUIZ MODE
// ─────────────────────────────────────────────
function QuizMode() {
  const [setIndex, setSetIndex] = useState(0);
  const [qIndex, setQIndex] = useState(0);
  const [answers, setAnswers] = useState({}); // key: qId → chosen index
  const [revealed, setRevealed] = useState({}); // key: qId → bool
  const [quizComplete, setQuizComplete] = useState(false);

  const currentSet = quizSets[setIndex];
  const currentQ = currentSet.questions[qIndex];
  const accentColor = QUIZ_PERIOD_COLORS[currentSet.period] || "#8a7040";

  const totalQs = quizSets.reduce((a, s) => a + s.questions.length, 0);
  const answeredCount = Object.keys(answers).length;
  const correctCount = quizSets.reduce((acc, s) => acc + s.questions.filter(q => answers[q.id] === q.correct).length, 0);

  const chooseAnswer = (idx) => {
    if (answers[currentQ.id] !== undefined) return; // already answered
    setAnswers(a => ({ ...a, [currentQ.id]: idx }));
    setRevealed(r => ({ ...r, [currentQ.id]: true }));
  };

  const goNext = () => {
    if (qIndex < currentSet.questions.length - 1) {
      setQIndex(i => i + 1);
    } else if (setIndex < quizSets.length - 1) {
      setSetIndex(i => i + 1);
      setQIndex(0);
    } else {
      setQuizComplete(true);
    }
  };

  const goPrev = () => {
    if (qIndex > 0) setQIndex(i => i - 1);
    else if (setIndex > 0) { setSetIndex(i => i - 1); setQIndex(quizSets[setIndex - 1].questions.length - 1); }
  };

  const resetQuiz = () => { setSetIndex(0); setQIndex(0); setAnswers({}); setRevealed({}); setQuizComplete(false); };

  const answered = answers[currentQ?.id] !== undefined;
  const isCorrect = answered && answers[currentQ.id] === currentQ.correct;
  const pct = totalQs > 0 ? Math.round((correctCount / totalQs) * 100) : 0;

  // flat question list progress
  let absoluteQIndex = 0;
  for (let s = 0; s < setIndex; s++) absoluteQIndex += quizSets[s].questions.length;
  absoluteQIndex += qIndex;

  if (quizComplete) {
    const grade = pct >= 80 ? { label: "Excellent", color: "#6ab86a" } : pct >= 65 ? { label: "Solid", color: "#c8a050" } : { label: "Keep Studying", color: "#c07050" };
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 48, gap: 24 }}>
        <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 14, letterSpacing: "0.2em", color: "#4a4838" }}>QUIZ COMPLETE</div>
        <div style={{ fontFamily: "'Libre Baskerville', Georgia, serif", fontSize: 72, fontWeight: 700, color: grade.color, lineHeight: 1 }}>{pct}%</div>
        <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 20, color: grade.color }}>{grade.label}</div>
        <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, color: "#5a5040" }}>{correctCount} correct out of {totalQs} questions</div>
        <div style={{ display: "flex", gap: 24, marginTop: 8 }}>
          {quizSets.map((s, si) => {
            const sc = s.questions.filter(q => answers[q.id] === q.correct).length;
            const sColor = QUIZ_PERIOD_COLORS[s.period] || "#8a7040";
            return (
              <div key={s.id} style={{ textAlign: "center", padding: "10px 14px", background: "rgba(255,255,255,0.03)", borderRadius: 8, border: `1px solid ${sColor}30`, minWidth: 70 }}>
                <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 20, color: sColor, letterSpacing: "0.05em" }}>{sc}/{s.questions.length}</div>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 9, color: "#3a3830", marginTop: 2, letterSpacing: "0.06em" }}>{s.period.replace(" (", "\n(")}</div>
              </div>
            );
          })}
        </div>
        <button onClick={resetQuiz} style={{ all: "unset", cursor: "pointer", marginTop: 16, padding: "12px 32px", borderRadius: 8, background: "rgba(200,160,80,0.15)", border: "1px solid rgba(200,160,80,0.35)", fontFamily: "'DM Sans', sans-serif", fontSize: 14, color: "#c8a050", letterSpacing: "0.04em" }}>
          ↺ Retake Quiz
        </button>
      </div>
    );
  }

  return (
    <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
      {/* SET SIDEBAR */}
      <div style={{ width: 220, flexShrink: 0, borderRight: "1px solid rgba(255,255,255,0.05)", background: "#0a0a0b", overflowY: "auto", padding: "14px 8px" }}>
        <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: "#4a4030", letterSpacing: "0.1em", textTransform: "uppercase", padding: "0 6px 10px" }}>Question Sets</div>
        <div style={{ padding: "8px 10px", background: "rgba(255,255,255,0.03)", borderRadius: 8, marginBottom: 12, border: "1px solid rgba(255,255,255,0.05)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
            <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#5a5040" }}>SCORE</span>
            <span style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 15, color: "#e8c060", letterSpacing: "0.04em" }}>{correctCount}/{answeredCount || "–"}</span>
          </div>
          <div className="progress-track">
            <div className="progress-fill" style={{ width: `${answeredCount > 0 ? (correctCount / answeredCount) * 100 : 0}%`, background: "linear-gradient(90deg, #5a9060, #6ab86a)" }} />
          </div>
        </div>
        {quizSets.map((s, si) => {
          const sc = s.questions.filter(q => answers[q.id] !== undefined).length;
          const cc = s.questions.filter(q => answers[q.id] === q.correct).length;
          const sColor = QUIZ_PERIOD_COLORS[s.period] || "#8a7040";
          const isActive = si === setIndex;
          return (
            <button key={s.id} onClick={() => { setSetIndex(si); setQIndex(0); }}
              style={{ all: "unset", cursor: "pointer", display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 10px", borderRadius: 7, width: "100%", boxSizing: "border-box", background: isActive ? `${sColor}18` : "transparent", borderLeft: isActive ? `2px solid ${sColor}` : "2px solid transparent", marginBottom: 2, transition: "all 0.15s" }}>
              <div style={{ display: "flex", flexDirection: "column", flex: 1, gap: 2 }}>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: isActive ? "#e8d8a0" : "#7a6848", fontWeight: isActive ? 500 : 400, lineHeight: 1.3 }}>{s.period}</div>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: "#4a4030", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.stimulusLabel.split(",")[0]}</div>
              </div>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: sc === s.questions.length ? "#6ab86a" : "#4a4030", flexShrink: 0, marginTop: 2 }}>
                {sc === 0 ? `${s.questions.length}q` : `${cc}/${sc}`}
              </div>
            </button>
          );
        })}
      </div>

      {/* QUIZ MAIN */}
      <div style={{ flex: 1, overflowY: "auto", padding: "28px 40px" }}>
        <div style={{ maxWidth: 760, margin: "0 auto", display: "flex", flexDirection: "column", gap: 20 }}>
          {/* progress bar */}
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#4a4838" }}>
              <span style={{ color: "#c8b060", fontWeight: 500 }}>Q {absoluteQIndex + 1}</span><span> / {totalQs}</span>
            </div>
            <div style={{ flex: 1 }}>
              <div className="progress-track">
                <div className="progress-fill" style={{ width: `${((absoluteQIndex + 1) / totalQs) * 100}%`, background: `linear-gradient(90deg, ${accentColor}88, ${accentColor})` }} />
              </div>
            </div>
            <span className="cat-chip" style={{ background: `${accentColor}20`, color: accentColor, border: `1px solid ${accentColor}40`, padding: "3px 10px" }}>{currentSet.period}</span>
          </div>

          {/* STIMULUS */}
          <div style={{ background: "rgba(255,255,255,0.02)", borderRadius: 10, border: `1px solid rgba(255,255,255,0.07)`, borderLeft: `3px solid ${accentColor}60`, overflow: "hidden" }}>
            <div style={{ padding: "10px 20px", borderBottom: "1px solid rgba(255,255,255,0.05)", display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ padding: "3px 10px", borderRadius: 4, background: `${accentColor}20`, border: `1px solid ${accentColor}40`, fontFamily: "'DM Sans', sans-serif", fontSize: 10, color: accentColor, letterSpacing: "0.08em", textTransform: "uppercase" }}>{currentSet.stimulusType}</div>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#4a4838", fontStyle: "italic" }}>{currentSet.stimulusLabel}</div>
            </div>
            <div style={{ padding: "18px 20px", fontFamily: "'Libre Baskerville', Georgia, serif", fontSize: 14, color: "#c8c0a8", lineHeight: 1.75, fontStyle: "italic" }}>
              "{currentSet.stimulus}"
            </div>
          </div>

          {/* QUESTION + CHOICES */}
          <div style={{ background: "rgba(255,255,255,0.02)", borderRadius: 10, border: "1px solid rgba(255,255,255,0.07)", overflow: "hidden" }}>
            <div style={{ padding: "18px 22px", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "#4a4030", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 10 }}>
                Question {qIndex + 1} of {currentSet.questions.length}
              </div>
              <div style={{ fontFamily: "'Libre Baskerville', Georgia, serif", fontSize: 16, color: "#e8dcc8", lineHeight: 1.55 }}>{currentQ.text}</div>
            </div>
            <div style={{ padding: "14px 22px 18px", display: "flex", flexDirection: "column", gap: 8 }}>
              {currentQ.choices.map((choice, ci) => {
                const chosen = answers[currentQ.id] === ci;
                const isRight = ci === currentQ.correct;
                const show = revealed[currentQ.id];

                let bg = "rgba(255,255,255,0.03)";
                let borderColor = "rgba(255,255,255,0.08)";
                let textColor = "#9a9080";
                let indicator = null;

                if (show) {
                  if (isRight) { bg = "rgba(60,130,60,0.12)"; borderColor = "rgba(60,130,60,0.4)"; textColor = "#a8d8a8"; indicator = "✓"; }
                  else if (chosen) { bg = "rgba(160,50,50,0.12)"; borderColor = "rgba(160,50,50,0.4)"; textColor = "#d89090"; indicator = "✗"; }
                  else { bg = "rgba(255,255,255,0.01)"; textColor = "#5a5040"; }
                } else if (!answered) {
                  bg = "rgba(255,255,255,0.03)";
                }

                return (
                  <button key={ci} onClick={() => chooseAnswer(ci)}
                    style={{ all: "unset", cursor: answered ? "default" : "pointer", display: "flex", alignItems: "flex-start", gap: 12, padding: "12px 16px", borderRadius: 8, background: bg, border: `1px solid ${borderColor}`, transition: "all 0.2s", boxSizing: "border-box" }}
                    onMouseEnter={e => { if (!answered) e.currentTarget.style.background = "rgba(255,255,255,0.06)"; }}
                    onMouseLeave={e => { if (!answered) e.currentTarget.style.background = "rgba(255,255,255,0.03)"; }}>
                    <div style={{ flexShrink: 0, width: 22, height: 22, borderRadius: 6, background: show && isRight ? "rgba(60,130,60,0.25)" : show && chosen ? "rgba(160,50,50,0.25)" : "rgba(255,255,255,0.06)", border: `1px solid ${show && isRight ? "rgba(60,130,60,0.5)" : show && chosen ? "rgba(160,50,50,0.5)" : "rgba(255,255,255,0.12)"}`, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: show && isRight ? "#6ab86a" : show && chosen ? "#c07070" : "#5a5040", fontWeight: 600 }}>
                      {indicator || String.fromCharCode(65 + ci)}
                    </div>
                    <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, color: textColor, lineHeight: 1.5, paddingTop: 2 }}>{choice}</div>
                  </button>
                );
              })}
            </div>

            {/* EXPLANATION */}
            {revealed[currentQ.id] && (
              <div style={{ margin: "0 22px 18px", padding: "14px 16px", background: isCorrect ? "rgba(60,130,60,0.08)" : "rgba(160,80,40,0.08)", borderRadius: 8, border: `1px solid ${isCorrect ? "rgba(60,130,60,0.25)" : "rgba(160,80,40,0.25)"}` }}>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: isCorrect ? "#6ab86a" : "#c08060", marginBottom: 6 }}>
                  {isCorrect ? "✓ Correct" : `✗ Incorrect · Correct answer: ${String.fromCharCode(65 + currentQ.correct)}`}
                </div>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#a8a090", lineHeight: 1.6 }}>{currentQ.explanation}</div>
              </div>
            )}
          </div>

          {/* NAV BUTTONS */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <button onClick={goPrev} disabled={setIndex === 0 && qIndex === 0}
              style={{ all: "unset", cursor: "pointer", padding: "9px 20px", borderRadius: 8, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.1)", fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#7a7060", opacity: (setIndex === 0 && qIndex === 0) ? 0.3 : 1 }}>
              ← Previous
            </button>
            {answered ? (
              <button onClick={goNext}
                style={{ all: "unset", cursor: "pointer", padding: "9px 24px", borderRadius: 8, background: `${accentColor}22`, border: `1px solid ${accentColor}50`, fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: accentColor, fontWeight: 500 }}>
                {setIndex === quizSets.length - 1 && qIndex === currentSet.questions.length - 1 ? "See Results →" : "Next Question →"}
              </button>
            ) : (
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#3a3830", fontStyle: "italic" }}>Select an answer to continue</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
//  ROOT APP
// ─────────────────────────────────────────────
function APUSHApp() {
  const [mode, setMode] = useState("flashcards");

  return (
    <div style={{ minHeight: "100vh", maxHeight: "100vh", overflow: "hidden", background: "#0e0e0f", fontFamily: "'Libre Baskerville', Georgia, serif", color: "#ddd4c0", display: "flex", flexDirection: "column" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .card-scene { perspective: 1400px; width: 100%; max-width: 700px; }
        .card-body { width: 100%; height: 320px; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); cursor: pointer; position: relative; }

        .card-front-face { background: linear-gradient(160deg, #1a1a1e 0%, #16161a 100%); box-shadow: 0 20px 80px rgba(0,0,0,0.6); }
        .card-back-face { background: linear-gradient(160deg, #131318 0%, #111116 100%); box-shadow: 0 20px 80px rgba(0,0,0,0.7); transform: rotateY(180deg); }
        .cat-chip { display: inline-block; padding: 3px 12px; border-radius: 4px; font-size: 10px; font-family: 'DM Sans', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; }
        .sidebar-btn { all: unset; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 12px; border-radius: 6px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: #7a7060; transition: all 0.15s; width: 100%; box-sizing: border-box; }
        .sidebar-btn:hover { background: rgba(255,255,255,0.04); color: #c0b090; }
        .sidebar-btn.active { background: rgba(255,255,255,0.07); color: #e8d8a0; }
        .ctrl-btn { all: unset; cursor: pointer; padding: 8px 20px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; transition: all 0.15s; letter-spacing: 0.02em; }
        .nav-btn { all: unset; cursor: pointer; padding: 8px 20px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #8a8070; font-size: 22px; line-height: 1; transition: all 0.15s; }
        .nav-btn:hover { background: rgba(255,255,255,0.09); color: #c0b090; }
        .nav-btn:disabled { opacity: 0.2; cursor: default; }
        .progress-track { background: rgba(255,255,255,0.05); border-radius: 3px; height: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .radio-label { display: flex; align-items: center; gap: 5px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: #7a7060; cursor: pointer; }
        .radio-label input { accent-color: #c8a050; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
      `}</style>

      {/* TOP BAR */}
      <div style={{ height: 54, flexShrink: 0, borderBottom: "1px solid rgba(255,255,255,0.06)", display: "flex", alignItems: "center", padding: "0 24px", gap: 20, background: "#0a0a0b" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ fontFamily: "'Bebas Neue', Impact, sans-serif", fontSize: 22, letterSpacing: "0.12em", color: "#e8c060" }}>AP US HISTORY</div>
          <div style={{ width: 1, height: 20, background: "rgba(255,255,255,0.1)" }} />
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#5a5040" }}>{allCards.length} terms · {quizSets.reduce((a,s)=>a+s.questions.length,0)} practice questions</div>
        </div>
        {/* MODE TABS */}
        <div style={{ marginLeft: "auto", display: "flex", gap: 4, background: "rgba(255,255,255,0.04)", borderRadius: 8, padding: 3 }}>
          {[["flashcards", "📇 Flashcards"], ["quiz", "📝 Practice Quiz"]].map(([m, label]) => (
            <button key={m} onClick={() => setMode(m)}
              style={{ all: "unset", cursor: "pointer", padding: "6px 18px", borderRadius: 6, fontFamily: "'DM Sans', sans-serif", fontSize: 13, fontWeight: 500, transition: "all 0.2s", background: mode === m ? "rgba(200,160,60,0.15)" : "transparent", color: mode === m ? "#e8c060" : "#6a6050", border: mode === m ? "1px solid rgba(200,160,60,0.3)" : "1px solid transparent" }}>
              {label}
            </button>
          ))}
        </div>
      </div>

      {/* CONTENT */}
      {mode === "flashcards" ? <FlashcardMode /> : <QuizMode />}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(APUSHApp));
  </script>
</body>
