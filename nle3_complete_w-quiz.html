  { id:3, category:"Participles", before:"Oppidō ", underlined:"captō", after:", mīlitēs discessērunt.", question:"The underlined word is best translated as", choices:["having been captured","capturing","was captured","to be captured"], correct:0, explanation:"captō is the PPP of capiō in the ablative singular neuter, forming an ablative absolute with oppidō. Translate: 'After the town was captured / With the town having been captured.' The noun in an ablative absolute cannot be the subject of the main clause." },
  { id:4, category:"Participles", before:"Dux exercitum ", underlined:"victūrus", after:" in castrīs manēbat.", question:"The underlined word is best translated as", choices:["about to conquer","having conquered","conquering","conquered"], correct:0, explanation:"victūrus is the future active participle of vincō, meaning 'about to conquer' or 'intending to conquer.' Future active participles (-ūrus/-ūra/-ūrum) express intention or imminent action. They are the active counterpart of the gerundive." },
  { id:5, category:"Participles", before:"Fēminae ", underlined:"lacrimantēs", after:" in viā stābant.", question:"The underlined word is best translated as", choices:["weeping","having wept","about to weep","wept"], correct:0, explanation:"lacrimantēs is the present active participle of lacrimō in the nominative plural, agreeing with fēminae. Present participles describe action simultaneous with the main verb: 'Women weeping stood in the road.'" },
  { id:6, category:"Participles", before:"Puer ā mātre ", underlined:"amātus", after:" laetus erat.", question:"The underlined word is best translated as", choices:["having been loved","loving","about to love","to be loved"], correct:0, explanation:"amātus is the PPP of amō, nominative singular masculine, agreeing with puer. The PPP always expresses completed passive action: 'The boy, having been loved by his mother, was happy.' The agent (ā mātre) is in the ablative with ā/ab." },
  { id:7, category:"Participles", before:"Rēge ", underlined:"mortuō", after:", cīvēs gavīsī sunt.", question:"The underlined form is best described as", choices:["part of an ablative absolute","a dative of reference","part of an indirect statement","part of a purpose clause"], correct:0, explanation:"rēge mortuō is an ablative absolute. mortuō is the PPP of morior in the ablative singular, agreeing with rēge. They form a phrase grammatically independent of the main clause: 'After the king died / With the king having died.'" },
  { id:8, category:"Indirect Statement", before:"Dīcit ", underlined:"Caesarem", after:" venīre.", question:"The underlined word is accusative because it is", choices:["the subject of an infinitive in indirect statement","the direct object of dīcit","an accusative of duration","the object of a preposition"], correct:0, explanation:"In indirect statement (acc. + inf.) after verbs of saying/thinking, the subject of the infinitive goes into the accusative. Caesarem is the accusative subject of venīre: 'He says that Caesar is coming.'" },
  { id:9, category:"Indirect Statement", before:"Crēdō mīlitēs ", underlined:"pugnāvisse", after:".", question:"The underlined word indicates that the fighting occurred", choices:["before the main verb","at the same time as the main verb","after the main verb","in the future"], correct:0, explanation:"pugnāvisse is the perfect active infinitive (stem + -isse). In indirect statement, a perfect infinitive indicates action BEFORE the main verb: 'I believe the soldiers fought / have fought.' Present inf. = same time; future inf. = after." },
  { id:10, category:"Indirect Statement", before:"Scīmus eōs ", underlined:"ventūrōs esse", after:".", question:"The underlined phrase indicates that the coming will occur", choices:["after the main verb","before the main verb","at the same time as the main verb","in the past"], correct:0, explanation:"ventūrōs esse is the future active infinitive (future active participle + esse). In indirect statement, the future infinitive indicates action AFTER the main verb: 'We know that they will come.' The participle (ventūrōs) agrees with eōs in accusative masculine plural." },
  { id:11, category:"Indirect Statement", before:"Putābam tē ", underlined:"esse", after:" fortem.", question:"The tense of the underlined infinitive indicates that being brave occurred", choices:["at the same time as putābam","before putābam","after putābam","in the future"], correct:0, explanation:"esse is the present infinitive of sum. A present infinitive in indirect statement indicates action simultaneous with the main verb. Since putābam is imperfect (past), esse indicates: 'I was thinking that you were brave' — both happening at the same time in the past." },
  { id:12, category:"Indirect Statement", before:"Dīxit sē ", underlined:"vīcisse", after:".", question:"The underlined word is best translated as", choices:["to have conquered","to conquer","about to conquer","conquering"], correct:0, explanation:"vīcisse is the perfect active infinitive of vincō (stem vīc- + -isse). In indirect statement after dīxit (secondary tense), the perfect infinitive indicates action before the main verb: 'He said that he had conquered.' Note sē refers reflexively back to the subject of dīxit." },
  { id:13, category:"Ablative Uses", before:"Hostis ", underlined:"gladiō", after:" pugnābat.", question:"The underlined word expresses", choices:["means/instrument","agent","manner","accompaniment"], correct:0, explanation:"gladiō is the ablative of means/instrument — no preposition used. The ablative of means answers 'with what?' using a thing (not a person): 'The enemy was fighting with a sword.' Contrast ablative of agent (ā/ab + abl., with a person): ā mīlite pugnābātur." },
  { id:14, category:"Ablative Uses", before:"Dux ā ", underlined:"mīlitibus", after:" laudātus est.", question:"The underlined word expresses", choices:["agent","means","separation","manner"], correct:0, explanation:"mīlitibus is the ablative of agent (ā/ab + ablative with a person) in a passive construction. 'The general was praised by the soldiers.' Contrast ablative of means (no preposition, used with things): gladiō pugnāvit." },
  { id:14, category:"Ablative Uses", before:"Magnā ", underlined:"cum cūrā", after:" scrīpsit.", question:"The underlined phrase expresses", choices:["manner","accompaniment","means","agent"], correct:0, explanation:"cum cūrā is the ablative of manner, indicating HOW an action is performed. When an adjective modifies the noun, cum is placed between them: magnā cum cūrā. Without an adjective, cum precedes: cum cūrā. Translate: 'He wrote with great care.'" },
  { id:15, category:"Ablative Uses", before:"Haec urbs multō ", underlined:"maior", after:" est.", question:"The word multō is best described as", choices:["an ablative of degree of difference","an ablative of means","an ablative of time when","an ablative of manner"], correct:0, explanation:"multō is the ablative of degree of difference, expressing by how much something differs from another. It appears with comparatives: multō maior = 'greater by much' = 'much greater.' Other examples: paulō minor (smaller by a little), longē fortior (braver by far)." },
  { id:16, category:"Ablative Uses", before:"Puerī ā scholā ", underlined:"discessērunt", after:".", question:"The phrase ā scholā expresses", choices:["separation","agent","manner","means"], correct:0, explanation:"ā scholā is the ablative of separation, indicating movement away from something. Ablative of separation uses ā/ab, dē, or ex (or sometimes just the plain ablative with verbs like careō, abstineō): 'The boys departed from school.'" },
  { id:17, category:"Gerund & Gerundive", before:"Ars ", underlined:"scrībendī", after:" difficilis est.", question:"The underlined word is", choices:["a gerund in the genitive","a gerundive in the genitive","a present participle","a perfect infinitive"], correct:0, explanation:"scrībendī is the gerund of scrībō in the genitive (ars + genitive = 'the art of ___ing'). The gerund is a verbal noun with no nominative form; it declines only in gen., dat., acc., and abl. 'The art of writing.' Gerunds take the same objects as their verb." },
  { id:18, category:"Gerund & Gerundive", before:"Mīlitēs ad ", underlined:"pugnandum", after:" vēnērunt.", question:"The underlined word is best translated as", choices:["fighting / to fight","having fought","fighters","must fight"], correct:0, explanation:"pugnandum is the gerund of pugnō in the accusative with ad, expressing purpose: 'The soldiers came for the purpose of fighting / to fight.' Ad + gerund (accusative) is a common Latin way to express purpose with a verbal noun." },
  { id:19, category:"Gerund & Gerundive", before:"Hoc mihi ", underlined:"faciendum", after:" est.", question:"The underlined word indicates", choices:["necessity — this must be done","possibility — this can be done","a completed action","a purpose clause"], correct:0, explanation:"faciendum est is the passive periphrastic: gerundive + sum = 'must be ___ed.' The gerundive (faciendum, neuter) agrees with hoc and expresses obligation. The person who must act goes in the dative (mihi = 'by me'): 'This must be done by me.'" },
  { id:20, category:"Gerund & Gerundive", before:"Lēgātī pācem ", underlined:"petendī", after:" causā vēnērunt.", question:"The underlined word is best described as", choices:["a gerund in the genitive expressing purpose","a gerundive agreeing with pācem","a present participle","a perfect passive participle"], correct:0, explanation:"petendī is the gerund of petō in the genitive. causā (or grātiā) + genitive expresses purpose: 'for the sake of seeking.' 'The ambassadors came for the sake of seeking peace.' This is one of Latin's standard purpose constructions with a verbal noun." },
  { id:21, category:"Gerund & Gerundive", before:"Librī ", underlined:"legendī", after:" sunt.", question:"The underlined word indicates", choices:["the books must be read","the books are being read","the books have been read","the books are readable"], correct:0, explanation:"legendī sunt is a passive periphrastic: gerundive + esse. legendī is the gerundive of legō in the nominative plural masculine, agreeing with librī. Gerundive + sum = obligation: 'The books must be read.' The agent, if expressed, goes in the dative." },
  { id:22, category:"Subjunctive: Purpose", before:"Vēnit ut tē ", underlined:"vidēret", after:".", question:"The underlined verb is subjunctive because", choices:["it is in a purpose clause expressing the goal of the main action","it is in a result clause","it is in an indirect question","it is in a fear clause"], correct:0, explanation:"vidēret is imperfect subjunctive in a purpose clause introduced by ut. Purpose clauses use ut (positive) or nē (negative) + subjunctive: 'He came in order to see you.' Imperfect subjunctive is used because vēnit (perfect) is a secondary tense — following sequence of tenses." },
  { id:23, category:"Subjunctive: Purpose", before:"Fūgērunt nē ", underlined:"caperēntur", after:".", question:"The underlined verb is best translated as", choices:["they might be captured","they were captured","they had been captured","they would capture"], correct:0, explanation:"caperēntur is the imperfect passive subjunctive of capiō in a negative purpose clause (nē + subjunctive). 'They fled so that they might not be captured / lest they be captured.' The passive form shows the action would be done TO them." },
  { id:24, category:"Subjunctive: Purpose", before:"Caesar mīlitēs mīsit quī hostēs ", underlined:"vincerent", after:".", question:"The underlined verb is subjunctive because", choices:["it is in a relative clause of purpose","it is in a result clause","it is a relative clause of characteristic","it is in an indirect question"], correct:0, explanation:"vincerent is imperfect subjunctive in a relative purpose clause. When a relative pronoun introduces a purpose clause, the verb goes in the subjunctive: 'Caesar sent soldiers who were to conquer / to conquer the enemies.' The relative takes the place of ut." },
  { id:25, category:"Subjunctive: Result", before:"Tam fortis erat ut nēmō eum ", underlined:"vinceret", after:".", question:"What signals that a result clause follows?", choices:["tam before fortis","the word nēmō","the word ut","the imperfect tense"], correct:0, explanation:"tam is the signal word. tam, ita, tantus, tālis, tot, and adeō in the main clause introduce a result clause (ut + subjunctive). 'He was SO brave that no one conquered him.' Result describes what actually happens; purpose describes an intended goal." },
  { id:26, category:"Subjunctive: Result", before:"Ita clāmāvit ut omnēs ", underlined:"audīrent", after:".", question:"The underlined verb is best translated as", choices:["heard","might hear","had heard","will hear"], correct:0, explanation:"audīrent is imperfect subjunctive in a result clause. Result clauses translate with the English indicative: 'He shouted in such a way that everyone heard.' This distinguishes result (translates as indicative) from purpose (translates as 'in order to' or 'so that...might')." },
  { id:27, category:"Subjunctive: Indirect Command", before:"Imperāvit ut mīlitēs ", underlined:"pugnārent", after:".", question:"What case does imperō take for the person commanded?", choices:["dative","accusative","ablative","genitive"], correct:0, explanation:"pugnārent is imperfect subjunctive in an indirect command. imperō takes the DATIVE for the person commanded + ut/nē + subjunctive: imperāvit mīlitibus ut pugnārent — 'He ordered the soldiers to fight.' Contrast: iubeō takes accusative + infinitive (iussit mīlitēs pugnāre)." },
  { id:28, category:"Subjunctive: Indirect Command", before:"Hortātus est nē ", underlined:"fugerent", after:".", question:"The underlined verb is best translated as", choices:["they should flee","they fled","they had fled","they will flee"], correct:0, explanation:"fugerent is imperfect subjunctive in a negative indirect command (nē + subjunctive). hortor takes ut/nē + subjunctive: 'He encouraged them not to flee.' Other verbs taking ut/nē + subj.: rogō, ōrō, persuādeō, moneō, imperō." },
  { id:29, category:"Subjunctive: Cum Clauses", before:"Cum Caesar ", underlined:"venīret", after:", mīlitēs timēbant.", question:"The underlined verb is subjunctive because", choices:["cum introduces a circumstantial clause describing when the main action occurred","cum always takes the subjunctive","it is in a purpose clause","the tense requires subjunctive"], correct:0, explanation:"venīret is imperfect subjunctive in a cum circumstantial clause. When cum means 'when/as' and describes circumstances surrounding the main action (not a specific point in time), it takes the subjunctive. 'As/When Caesar was coming, the soldiers were afraid.' Cum + indicative = specific point in time." },
  { id:30, category:"Subjunctive: Cum Clauses", before:"Cum fortis ", underlined:"esset", after:", tamen timēbat.", question:"In this sentence, cum most likely means", choices:["although","when","because","in order that"], correct:0, explanation:"The word tamen ('nevertheless') in the main clause is the decisive signal. Tamen after cum + subjunctive signals a concessive cum clause: 'Although he was brave, he was nevertheless afraid.' Concessive cum = 'although'; causal cum = 'since/because'; temporal cum (subjunctive) = 'when.'" },
  { id:31, category:"Subjunctive: Cum Clauses", before:"Cum Rōmā ", underlined:"discessisset", after:", laetus erat.", question:"The pluperfect subjunctive indicates that the departure occurred", choices:["before erat","at the same time as erat","after erat","in the future"], correct:0, explanation:"discessisset is pluperfect subjunctive in secondary sequence (main verb erat = imperfect). Pluperfect subjunctive in secondary sequence = action completed BEFORE the main verb: 'After he had departed from Rome, he was happy.'" },
  { id:32, category:"Subjunctive: Fear Clauses", before:"Timeō nē hostēs ", underlined:"veniant", after:".", question:"The underlined verb is best translated as", choices:["are coming / will come","came","should come","had come"], correct:0, explanation:"veniant is present subjunctive in a fear clause. timeō/vereor + nē + subjunctive expresses fear that something WILL happen: 'I fear that the enemies are coming / will come.' English uses the indicative in translation. Memory trick: nē after a fear verb = normal English 'that.'" },
  { id:33, category:"Subjunctive: Fear Clauses", before:"Verētur ut pater ", underlined:"redeat", after:".", question:"The underlined verb indicates fear that the father", choices:["will NOT return","is returning","returned","had returned"], correct:0, explanation:"redeat is present subjunctive after ut in a fear clause. vereor ut + subjunctive expresses fear that something will NOT happen: 'He fears that his father will not return.' This is Latin's trickiest fear construction: vereor ut = fear that...NOT; vereor nē = fear that (the thing happens)." },
  { id:34, category:"Subjunctive: Indirect Question", before:"Nesciō ubi ", underlined:"sit", after:".", question:"The underlined verb is subjunctive because", choices:["it is in an indirect question after a verb of not knowing","it is in a purpose clause","sit is always subjunctive","it follows nē"], correct:0, explanation:"sit is present subjunctive in an indirect question. Latin puts the verb of an indirect question in the subjunctive, introduced by a verb of knowing/asking + interrogative word (ubi, quid, cūr, quōmodo, num, etc.): 'I do not know where he is.' Primary sequence: nesciō (present) → present subj." },
  { id:35, category:"Subjunctive: Indirect Question", before:"Rogāvit quid ", underlined:"fēcissēmus", after:".", question:"The pluperfect subjunctive indicates that the action described", choices:["occurred before rogāvit","occurred at the same time as rogāvit","occurred after rogāvit","was ongoing"], correct:0, explanation:"fēcissēmus is pluperfect subjunctive. rogāvit (perfect) is secondary, so secondary sequence applies. Pluperfect subj. in secondary sequence = action completed before the main verb: 'He asked what we had done.'" },
  { id:36, category:"Subjunctive: Indirect Question", before:"Dīcit cūr tū ", underlined:"vēneris", after:".", question:"The perfect subjunctive here indicates that the coming", choices:["is completed before dīcit (primary sequence)","occurs after dīcit","is ongoing with dīcit","is a past contrary-to-fact"], correct:0, explanation:"vēneris is perfect subjunctive. dīcit (present) is primary, so primary sequence: present subj. (same time) or perfect subj. (completed action). Perfect subj. in primary sequence = action completed before the main verb: 'He says why you came / have come.'" },
  { id:37, category:"Deponent Verbs", before:"Mīlitēs ducem ", underlined:"secūtī sunt", after:".", question:"The underlined phrase is best translated as", choices:["followed","were followed","having been followed","to be followed"], correct:0, explanation:"secūtī sunt looks like a perfect passive form, but sequor is a deponent verb — passive in form, ACTIVE in meaning. 'The soldiers followed the leader.' All deponent verbs use passive forms but must be translated actively. Never translate secūtī sunt as 'were followed.'" },
  { id:38, category:"Deponent Verbs", before:"Rōmā ", underlined:"profectus est", after:".", question:"The underlined phrase is best translated as", choices:["set out / departed","was set out","having been set out","to set out"], correct:0, explanation:"profectus est is the perfect of proficīscor, a deponent verb (passive form, active meaning). 'He set out from Rome.' The ablative Rōmā (place from which) needs no preposition with city names." },
  { id:39, category:"Deponent Verbs", before:"Imperātor gladiō ", underlined:"ūsus est", after:".", question:"The underlined phrase is best translated as", choices:["used","was used","is used","to use"], correct:0, explanation:"ūsus est is the perfect of ūtor, a deponent verb: passive form, active meaning. 'The general used a sword.' Critical: ūtor always takes the ABLATIVE case (gladiō, not gladium). Other verbs requiring ablative: fruor (enjoy), fungor (perform), potior (possess), vescor (feed on)." },
  { id:40, category:"Deponent Verbs", before:"Multa in bellō ", underlined:"passī sumus", after:".", question:"The underlined phrase is best translated as", choices:["we suffered / have suffered","we were suffered","we are suffering","we had been suffered"], correct:0, explanation:"passī sumus is the perfect of patior (to suffer), a deponent verb. 'We have suffered many things in war.' The PPP (passī) is active in meaning despite looking passive. Students frequently mistranslate this as a passive — it is always active." },
  { id:41, category:"Deponent Verbs", before:"Mīlitēs ut fortiter pugnārent ", underlined:"hortātus est", after:".", question:"The correct translation of hortātus est is", choices:["he encouraged (active meaning)","he was encouraged (passive meaning)","they encouraged","it was encouraged"], correct:0, explanation:"hortātus est is the perfect of hortor, a deponent verb (passive form, active meaning). The subject doing the encouraging is singular (he/she). hortor + ut + subjunctive = 'to encourage/urge that.' Deponent verbs NEVER have a passive meaning even though their forms look passive." },
  { id:42, category:"Conditions", before:"Sī veniat, eum ", underlined:"videam", after:".", question:"This condition is best described as", choices:["future less vivid (should/would)","future more vivid","present contrary to fact","past contrary to fact"], correct:0, explanation:"Both verbs are present subjunctive (veniat, videam) — this is the FUTURE LESS VIVID ('should/would') condition: 'If he should come, I would see him.' This expresses a future event as a remote possibility. Future more vivid uses the indicative future; contrary-to-fact conditions use imperfect or pluperfect subjunctive." },
  { id:43, category:"Conditions", before:"Sī vēnisset, eum ", underlined:"vīdissem", after:".", question:"This condition is best described as", choices:["past contrary to fact","present contrary to fact","future less vivid","future more vivid"], correct:0, explanation:"Both verbs are pluperfect subjunctive (vēnisset, vīdissem) — PAST CONTRARY TO FACT: 'If he had come (but he didn't), I would have seen him.' Past contrary-to-fact: sī + pluperfect subj. / pluperfect subj. Present contrary-to-fact uses imperfect subjunctive." },
  { id:44, category:"Conditions", before:"Sī venīret, eum ", underlined:"vidērem", after:".", question:"This condition is best described as", choices:["present contrary to fact","past contrary to fact","future less vivid","future more vivid"], correct:0, explanation:"Both verbs are imperfect subjunctive (venīret, vidērem) — PRESENT CONTRARY TO FACT: 'If he were coming (but he isn't), I would see him.' Imperfect subjunctive = present time contrary to fact. Pluperfect subjunctive = past time contrary to fact." },
  { id:45, category:"Dative Uses", before:"Caesar exercituī ", underlined:"praefuit", after:".", question:"The word exercituī is dative because", choices:["praesum (a compound with prae-) governs the dative","it is an indirect object of a giving verb","it is a dative of agent","it is a dative of purpose"], correct:0, explanation:"exercituī is dative because praesum (prae + sum) is a compound verb governing the dative. Many Latin compound verbs take the dative: praeesse (be in charge of), prōdesse (benefit), nocēre (harm), imperāre (order), cōnfīdere (trust), resistere (resist). 'Caesar was in charge of the army.'" },
  { id:46, category:"Dative Uses", before:"Est ", underlined:"mihi", after:" liber.", question:"The underlined word expresses", choices:["possession (I have a book)","indirect object (a book is given to me)","agent in a passive periphrastic","dative of purpose"], correct:0, explanation:"mihi is the dative of possession. esse + dative = 'to have': Est mihi liber = 'There is a book to/for me' = 'I have a book.' This is an alternative to habeō + accusative and is common in Latin, especially in poetry and formal prose." },
  { id:47, category:"Dative Uses", before:"Hoc ", underlined:"mihi", after:" faciendum est.", question:"The underlined word expresses", choices:["the agent in a passive periphrastic (must be done by me)","the indirect object (to me)","possession (I have this)","dative of purpose"], correct:0, explanation:"mihi is the dative of agent in a passive periphrastic (gerundive + esse). In the passive periphrastic, the person who must do the action goes in the DATIVE — NOT ablative with ā/ab as in a regular passive. 'This must be done BY ME.'" },
  { id:48, category:"Sequence of Tenses", before:"Rogat cūr ", underlined:"veniat", after:".", question:"The underlined verb is present subjunctive because", choices:["rogat is primary, requiring present subj. for simultaneous action","indirect questions always use present subjunctive","cūr requires present subjunctive","venīre is irregular"], correct:0, explanation:"veniat is present subjunctive because of sequence of tenses. rogat (present) is a PRIMARY tense. In primary sequence: present subj. = action simultaneous with the main verb; perfect subj. = completed action. 'He asks why he is coming.' Compare secondary: rogāvit cūr venīret." },
  { id:49, category:"Sequence of Tenses", before:"Rogāvit cūr ", underlined:"venīret", after:".", question:"The underlined verb is imperfect subjunctive because", choices:["rogāvit is secondary, requiring imperfect subj. for simultaneous action","indirect questions always use imperfect subjunctive","the verb venīre is always imperfect","cūr requires imperfect subjunctive"], correct:0, explanation:"venīret is imperfect subjunctive because of sequence of tenses. rogāvit (perfect) is a SECONDARY tense. In secondary sequence: imperfect subj. = action simultaneous with main verb; pluperfect subj. = completed action. 'He asked why he was coming.'" },
  { id:50, category:"Place Expressions", before:"", underlined:"Rōmae", after:" multī hominēs habitant.", question:"The underlined word is in the locative. This means", choices:["at/in Rome — location at a city, no preposition needed","to Rome — motion toward","from Rome — motion away from","of Rome — possession"], correct:0, explanation:"Rōmae is the locative case, expressing location AT a city. The locative is used for cities, small islands, domus (domī = at home), and rūs (rūrī = in the country) with no preposition. Form matches the genitive for 1st/2nd declension singular: Rōmae, Corinthī. 'Many people live at/in Rome.'" },
  { id:51, category:"Place Expressions", before:"Caesar mīlitēs ", underlined:"Rōmam", after:" mīsit.", question:"The underlined word is accusative without a preposition because", choices:["city names use the accusative without a preposition for motion toward","Rōmam is the direct object of mīsit","all place names are accusative","motion verbs always take the accusative"], correct:0, explanation:"Rōmam is the accusative of place to which. City names, small island names, domus (domum = home), and rūs (rūs = to the country) use the accusative WITHOUT a preposition. Other nouns require in + accusative: in Italiam it (to Italy) vs. Rōmam it (to Rome)." },
  { id:52, category:"Relative Clause of Characteristic", before:"Nēmō est quī hoc ", underlined:"faciat", after:".", question:"The underlined verb is subjunctive because", choices:["it is in a relative clause of characteristic describing the type of person","quī always takes the subjunctive","it follows nēmō","it is in a purpose clause"], correct:0, explanation:"faciat is present subjunctive in a relative clause of characteristic. When the antecedent is indefinite or general (nēmō, nūllus, is, ūnus), the relative clause uses the subjunctive to describe the TYPE: 'There is no one who would/could do this.' Compare: a specific identified person would use the indicative." },
  { id:53, category:"Relative Clause of Characteristic", before:"Is es quī semper vērum ", underlined:"dīcās", after:".", question:"The underlined verb is subjunctive because", choices:["it is in a relative clause of characteristic after the general antecedent is","dīcō always takes the subjunctive","it is in an indirect question","it follows semper"], correct:0, explanation:"dīcās is present subjunctive in a relative clause of characteristic. The antecedent is is (such a person — indefinite/general reference). 'You are the kind of person who always speaks the truth.' The subjunctive marks this as describing a type, not a specific identified individual." },
  { id:54, category:"Hortatory & Jussive", before:"", underlined:"Eāmus", after:" et patriam dēfendāmus!", question:"The underlined verb is subjunctive because it is", choices:["a hortatory subjunctive expressing 'Let us go!'","an indirect command","a purpose clause","a result clause"], correct:0, explanation:"Eāmus is 1st person plural present subjunctive of eō — a hortatory subjunctive. Hortatory subjunctives (1st person plural, main clause, no conjunction) express exhortation: 'Let us go!' Similarly, dēfendāmus = 'Let us defend!' Negative: nē + subjunctive. Jussive = same in 3rd person: Dīcat = 'Let him speak.'" },
  { id:55, category:"Hortatory & Jussive", before:"Nē ", underlined:"fugiāmus", after:" sed fortiter pugnēmus!", question:"The underlined verb is best translated as", choices:["let us not flee","we should not have fled","we did not flee","let them not flee"], correct:0, explanation:"fugiāmus is 1st person plural present subjunctive in a hortatory construction negated by nē. Nē + hortatory subjunctive = 'let us not...' 'Let us not flee, but let us fight bravely!' This nē simply negates the hortatory — it is different from the nē introducing purpose or indirect command clauses." },
  { id:56, category:"Mixed: High Frequency", before:"Omnēs mīlitēs trēs ", underlined:"hōrās", after:" pugnāvērunt.", question:"The underlined word is accusative because it expresses", choices:["duration of time (how long)","time when","time within which","extent of space"], correct:0, explanation:"hōrās is the accusative of duration of time, expressing HOW LONG an action lasts — no preposition. 'All the soldiers fought for three hours.' Memory: HOW LONG → accusative; TIME WHEN → ablative (primā lūce); TIME WITHIN WHICH → ablative (paucīs diēbus)." },
  { id:57, category:"Mixed: High Frequency", before:"Mīlitēs ", underlined:"primā lūce", after:" profectī sunt.", question:"The underlined phrase is ablative because it expresses", choices:["time when","duration of time","time within which","manner"], correct:0, explanation:"primā lūce is the ablative of time when — expressing AT WHAT POINT something occurs, with no preposition. 'The soldiers set out at first light.' Contrast accusative of duration (for how long): multōs annōs — for many years." },
  { id:58, category:"Mixed: High Frequency", before:"Dux ", underlined:"magnō cum gaudiō", after:" nūntiāvit.", question:"The underlined phrase is best translated as", choices:["with great joy","by great joy","from great joy","because of great joy"], correct:0, explanation:"magnō cum gaudiō is the ablative of manner. When an adjective is present, cum is placed between the adjective and noun: magnō cum gaudiō. Without an adjective: cum gaudiō. Manner expresses HOW something is done: 'The leader announced with great joy.'" },
  { id:59, category:"Mixed: High Frequency", before:"Hoc dōnum tibi ", underlined:"datum est", after:".", question:"The underlined phrase is best translated as", choices:["was given","gave","had given","will be given"], correct:0, explanation:"datum est is the perfect passive: PPP (datum) + esse (est) = 'was given.' The subject is hoc dōnum (neuter singular), so the PPP is neuter (datum). The indirect object (tibi = to you) is in the dative. 'This gift was given to you.' Note: the PPP agrees with the subject in gender, number, case." },
  { id:60, category:"Mixed: High Frequency", before:"Puer ā magistrō ", underlined:"laudābātur", after:".", question:"The underlined verb is best translated as", choices:["was being praised","praised","had been praised","will be praised"], correct:0, explanation:"laudābātur is the imperfect passive indicative of laudō (3rd singular: -bā- = imperfect; -tur = passive). 'The boy was being praised by the teacher.' The imperfect passive describes ongoing or repeated action in the past. Contrast perfect passive: laudātus est (was praised, once)." },
  { id:61, category:"Mixed: High Frequency", before:"Caesar, ", underlined:"ut", after:" saepe dīcēbat, fortis erat.", question:"In this sentence, ut is best translated as", choices:["as","in order that","so that","when"], correct:0, explanation:"Here ut is used as a conjunction meaning 'as' — introducing a parenthetical comparison with the indicative (dīcēbat). ut with the indicative = 'as,' 'as when,' 'how.' This is distinct from ut + subjunctive (purpose or result). 'Caesar, as he often used to say, was brave.'" },
  { id:62, category:"Mixed: High Frequency", before:"Virī ", underlined:"fortēs", after:" patriam servant.", question:"The underlined word is best described as", choices:["a predicate nominative adjective agreeing with virī","an ablative of manner","a genitive of description","an accusative of respect"], correct:0, explanation:"fortēs is a nominative plural adjective agreeing with virī (2nd declension nominative plural masculine subject). Adjectives agree with their nouns in gender, number, and case. 'Brave men protect their homeland.' This tests basic adjective agreement, which the NLE tests frequently in seemingly simple sentences." },
];

// ════════════════════════════════════════════
//  QUIZ COMPONENT
// ════════════════════════════════════════════
const QUIZ_CAT_COLORS = {
  "Participles":"#c87a3a","Indirect Statement":"#5a7aaa","Ablative Uses":"#7a5a8a",
  "Gerund & Gerundive":"#6a8a5a","Subjunctive: Purpose":"#7a6aaa","Subjunctive: Result":"#6a7aaa",
  "Subjunctive: Indirect Command":"#5a8a7a","Subjunctive: Cum Clauses":"#8a6a7a",
  "Subjunctive: Fear Clauses":"#8a5a5a","Subjunctive: Indirect Question":"#5a7a8a",
  "Deponent Verbs":"#6a8a6a","Conditions":"#8a7a4a","Dative Uses":"#4a7a8a",
  "Sequence of Tenses":"#7a4a8a","Place Expressions":"#5a8a5a",
  "Relative Clause of Characteristic":"#8a5a7a","Hortatory & Jussive":"#7a8a4a",
  "Mixed: High Frequency":"#8a6a4a",
};
const getQColor = (cat) => QUIZ_CAT_COLORS[cat] || "#7a6040";

const quizCategories = ["All", ...Array.from(new Set(practiceQuestions.map(q => q.category)))];

function QuizMode() {
  const [selCat, setSelCat] = useState("All");
  const [queue, setQueue] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState({ correct: 0, total: 0 });
  const [catScores, setCatScores] = useState({});
  const [doShuffle, setDoShuffle] = useState(true);
  const [showSummary, setShowSummary] = useState(false);

  const buildQueue = useCallback(() => {
    let qs = selCat === "All" ? [...practiceQuestions] : practiceQuestions.filter(q => q.category === selCat);
    if (doShuffle) {
      for (let i = qs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [qs[i], qs[j]] = [qs[j], qs[i]];
      }
    }
    setQueue(qs); setQIdx(0); setSelected(null);
    setScore({ correct: 0, total: 0 }); setCatScores({}); setShowSummary(false);
  }, [selCat, doShuffle]);

  useEffect(() => { buildQueue(); }, [buildQueue]);

  const current = queue[qIdx];
  const accent = current ? getQColor(current.category) : "#8a6040";
  const isAnswered = selected !== null;
  const isCorrect = selected === current?.correct;

  const handleSelect = (i) => {
    if (isAnswered) return;
    setSelected(i);
    const correct = i === current.correct;
    setScore(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    setCatScores(cs => {
      const prev = cs[current.category] || { c: 0, t: 0 };
      return { ...cs, [current.category]: { c: prev.c + (correct ? 1 : 0), t: prev.t + 1 } };
    });
  };

  const next = () => {
    if (qIdx + 1 >= queue.length) { setShowSummary(true); return; }
    setQIdx(i => i + 1); setSelected(null);
  };

  const pct = score.total > 0 ? Math.round((score.correct / score.total) * 100) : 0;

  if (showSummary) {
    const finalPct = Math.round((score.correct / score.total) * 100);
    const grade = finalPct >= 90 ? "Excellent" : finalPct >= 75 ? "Solid" : finalPct >= 60 ? "Keep Practicing" : "Review & Retry";
    const gradeColor = finalPct >= 90 ? "#6ab870" : finalPct >= 75 ? "#c8a050" : finalPct >= 60 ? "#c87030" : "#a84040";
    return (
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 48px",overflow:"auto"}}>
        <div style={{maxWidth:640,width:"100%",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:"36px 40px"}}>
          <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:13,color:"#4a3a28",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:8}}>Quiz Complete</div>
          <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:60,fontWeight:700,color:gradeColor,lineHeight:1,marginBottom:4}}>{finalPct}%</div>
          <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:22,color:gradeColor,marginBottom:4}}>{grade}</div>
          <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:14,color:"#5a4a38",marginBottom:28}}>{score.correct} of {score.total} correct</div>
          <div style={{borderTop:"1px solid rgba(255,255,255,0.07)",paddingTop:20,marginBottom:24}}>
            <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:11,color:"#3a3028",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:12}}>By Category</div>
            {Object.entries(catScores).sort((a,b)=>(a[1].c/a[1].t)-(b[1].c/b[1].t)).map(([cat,s]) => (
              <div key={cat} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <span style={{width:8,height:8,borderRadius:2,background:getQColor(cat),flexShrink:0}}/>
                <span style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:13,color:"#8a7858",flex:1}}>{cat}</span>
                <span style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:15,fontWeight:600,color:s.c===s.t?"#6ab870":s.c/s.t>=0.5?"#c8a050":"#a84040"}}>{s.c}/{s.t}</span>
              </div>
            ))}
          </div>
          <button onClick={buildQueue} style={{all:"unset",cursor:"pointer",padding:"10px 28px",borderRadius:9,background:"rgba(200,160,60,0.12)",border:"1px solid rgba(200,160,60,0.3)",fontFamily:"'Crimson Text',Georgia,serif",fontSize:15,color:"#e8c060",fontWeight:600}}>↺ Try Again</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      {/* SIDEBAR */}
      <div style={{width:200,flexShrink:0,borderRight:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.25)",overflowY:"auto",padding:"10px 6px 16px"}}>
        <div style={{margin:"2px 4px 10px",padding:"9px 11px",background:"rgba(255,255,255,0.03)",borderRadius:7,border:"1px solid rgba(255,255,255,0.05)"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
            <span style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:10,color:"#4a3a28",letterSpacing:"0.1em",textTransform:"uppercase"}}>Score</span>
            <span style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:16,fontWeight:600,color:"#c8a050"}}>{score.total > 0 ? pct + "%" : "—"}</span>
          </div>
          {score.total > 0 && (
            <div style={{background:"rgba(255,255,255,0.05)",borderRadius:3,height:3,overflow:"hidden",marginBottom:5}}>
              <div style={{height:"100%",borderRadius:3,width:`${pct}%`,background:"linear-gradient(90deg,#8a5020,#c8a050)",transition:"width 0.4s"}}/>
            </div>
          )}
          <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:11,color:"#3a3028"}}>
            {score.correct} correct · {score.total} answered
          </div>
        </div>
        <button className="sb" style={{background:selCat==="All"?"rgba(255,255,255,0.07)":"transparent",color:selCat==="All"?"#e8c080":"#6a5a48"}} onClick={()=>setSelCat("All")}>
          <span>All Topics</span><span style={{fontSize:10,opacity:0.4}}>{practiceQuestions.length}</span>
        </button>
        {quizCategories.filter(c=>c!=="All").map(cat => (
          <button key={cat} className="sb" style={{background:selCat===cat?"rgba(255,255,255,0.07)":"transparent",color:selCat===cat?"#e8c080":"#6a5a48"}} onClick={()=>setSelCat(cat)}>
            <span style={{display:"flex",alignItems:"center",gap:5,overflow:"hidden"}}>
              <span style={{width:6,height:6,borderRadius:2,background:getQColor(cat),flexShrink:0}}/>
              <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:12}}>{cat}</span>
            </span>
            <span style={{fontSize:10,opacity:0.4,flexShrink:0}}>{practiceQuestions.filter(q=>q.category===cat).length}</span>
          </button>
        ))}
      </div>

      {/* MAIN */}
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"16px 48px",gap:16,overflow:"auto"}}>
        {/* controls */}
        <div style={{display:"flex",alignItems:"center",gap:14,width:"100%",maxWidth:700}}>
          <label className="rlabel"><input type="checkbox" checked={doShuffle} onChange={e=>setDoShuffle(e.target.checked)} style={{accentColor:"#c8a050"}}/>Shuffle</label>
          <button className="ghost-btn" onClick={buildQueue}>↺ Restart</button>
          <div style={{marginLeft:"auto",fontFamily:"'Crimson Text',Georgia,serif",fontSize:12,color:"#3a3028"}}>
            <span style={{color:"#c8a050"}}>{qIdx+1}</span> of {queue.length}
          </div>
        </div>

        {current && (
          <div style={{width:"100%",maxWidth:700,display:"flex",flexDirection:"column",gap:14}}>
            {/* progress bar */}
            <div style={{background:"rgba(255,255,255,0.05)",borderRadius:3,height:3,overflow:"hidden"}}>
              <div style={{height:"100%",borderRadius:3,width:`${((qIdx+1)/queue.length)*100}%`,background:`linear-gradient(90deg,${accent}80,${accent})`,transition:"width 0.4s"}}/>
            </div>

            {/* QUESTION CARD */}
            <div style={{background:"linear-gradient(150deg,#18141f,#120e18)",border:`1px solid rgba(255,255,255,0.06)`,borderTop:`3px solid ${accent}55`,borderRadius:12,padding:"24px 28px",boxShadow:"0 16px 60px rgba(0,0,0,0.6)"}}>
              {/* category tag */}
              <div style={{marginBottom:14}}>
                <span style={{display:"inline-block",padding:"2px 10px",borderRadius:4,background:`${accent}1a`,color:accent,border:`1px solid ${accent}35`,fontFamily:"'Crimson Text',Georgia,serif",fontSize:10,letterSpacing:"0.08em",textTransform:"uppercase"}}>
                  {current.category}
                </span>
              </div>

              {/* Latin phrase with underline */}
              <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:24,fontWeight:500,color:"#e8ddc0",lineHeight:1.5,marginBottom:14,fontStyle:"italic"}}>
                {current.before}
                <span style={{textDecoration:"underline",textDecorationColor:`${accent}cc`,textUnderlineOffset:"4px",textDecorationThickness:2,color:"#fff8e8",fontWeight:700}}>
                  {current.underlined}
                </span>
                {current.after}
              </div>

              {/* question text */}
              <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:15,color:"#7a6a50",marginBottom:18}}>
                {current.question}
              </div>

              {/* choices */}
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {current.choices.map((ch, i) => {
                  let bg = "rgba(255,255,255,0.03)";
                  let border = "1px solid rgba(255,255,255,0.07)";
                  let color = "#b0a080";
                  let cursor = isAnswered ? "default" : "pointer";
                  if (isAnswered) {
                    if (i === current.correct) { bg="rgba(60,120,60,0.15)"; border="1px solid rgba(60,140,60,0.4)"; color="#7ad880"; }
                    else if (i === selected) { bg="rgba(140,40,40,0.15)"; border="1px solid rgba(160,60,60,0.4)"; color="#d87070"; }
                  }
                  return (
                    <button key={i} onClick={()=>handleSelect(i)} style={{all:"unset",cursor,padding:"10px 16px",borderRadius:8,background:bg,border,color,fontFamily:"'Crimson Text',Georgia,serif",fontSize:15,display:"flex",alignItems:"center",gap:10,transition:"all 0.15s",...(!isAnswered&&{":hover":{background:"rgba(255,255,255,0.07)"}})}}>
                      <span style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:14,color:isAnswered&&i===current.correct?"#7ad880":isAnswered&&i===selected?"#d87070":"#5a4a38",fontWeight:600,flexShrink:0,width:18}}>
                        {["A","B","C","D"][i]}.
                      </span>
                      {ch}
                      {isAnswered && i === current.correct && <span style={{marginLeft:"auto",fontSize:14}}>✓</span>}
                      {isAnswered && i === selected && i !== current.correct && <span style={{marginLeft:"auto",fontSize:14}}>✗</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* EXPLANATION (shown after answering) */}
            {isAnswered && (
              <div style={{background:"rgba(0,0,0,0.3)",border:"1px solid rgba(255,255,255,0.06)",borderLeft:`3px solid ${isCorrect?"#5a9a5a":"#9a5a5a"}`,borderRadius:8,padding:"16px 20px"}}>
                <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:11,letterSpacing:"0.1em",textTransform:"uppercase",color:isCorrect?"#5a8a5a":"#8a5a5a",marginBottom:6}}>
                  {isCorrect ? "✓ Correct" : "✗ Incorrect"} — Explanation
                </div>
                <div style={{fontFamily:"'DM Mono','Courier New',monospace",fontSize:11.5,lineHeight:1.75,color:"#a0b8a0",whiteSpace:"pre-wrap"}}>
                  {current.explanation}
                </div>
                <button onClick={next} style={{all:"unset",cursor:"pointer",marginTop:14,padding:"8px 24px",borderRadius:8,background:"rgba(200,160,60,0.12)",border:"1px solid rgba(200,160,60,0.3)",fontFamily:"'Crimson Text',Georgia,serif",fontSize:14,color:"#e8c060",fontWeight:600}}>
                  {qIdx + 1 >= queue.length ? "See Results →" : "Next Question →"}
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function NLEApp() {
  const [mode, setMode] = useState("vocab");

  return (
    <div style={{minHeight:"100vh",maxHeight:"100vh",overflow:"hidden",background:"radial-gradient(ellipse at 25% 30%, #1a0e05 0%, #0d0902 55%, #050304 100%)",fontFamily:"'Crimson Text',Georgia,serif",color:"#e0d4c0",display:"flex",flexDirection:"column"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,600&family=DM+Mono:wght@400;500&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        .sb{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:5px;font-family:'Crimson Text',Georgia,serif;font-size:12.5px;transition:all 0.15s;width:100%;box-sizing:border-box;}
        .sb:hover{background:rgba(255,255,255,0.04);}
        .nav-btn{all:unset;cursor:pointer;padding:8px 22px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#7a6848;font-size:20px;line-height:1;transition:all 0.15s;}
        .nav-btn:hover{background:rgba(255,255,255,0.08);color:#c0a060;}
        .nav-btn:disabled{opacity:0.2;cursor:default;}
        .mark-btn{all:unset;cursor:pointer;padding:7px 18px;border-radius:8px;font-family:'Crimson Text',Georgia,serif;font-size:14px;transition:all 0.15s;}
        .rlabel{display:flex;align-items:center;gap:5px;font-family:'Crimson Text',Georgia,serif;font-size:13px;color:#7a6a50;cursor:pointer;}
        .ghost-btn{all:unset;cursor:pointer;padding:4px 14px;border-radius:6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);font-family:'Crimson Text',Georgia,serif;font-size:13px;color:#7a6848;}
        ::-webkit-scrollbar{width:3px;}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px;}
      `}</style>

      {/* TOP BAR */}
      <div style={{height:54,flexShrink:0,borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",alignItems:"center",padding:"0 24px",gap:16,background:"rgba(0,0,0,0.35)"}}>
        <div style={{fontFamily:"'Cormorant Garamond',Georgia,serif",fontSize:20,fontWeight:700,fontStyle:"italic",color:"#d4a84a",letterSpacing:"0.02em"}}>
          National Latin Exam · Level III
        </div>
        <div style={{width:1,height:18,background:"rgba(255,255,255,0.08)"}}/>
        <div style={{fontFamily:"'Crimson Text',Georgia,serif",fontSize:12,color:"#4a4030"}}>
          {vocabCards.length + grammarCards.length} cards · {practiceQuestions.length} practice questions
        </div>

        {/* MODE TABS */}
        <div style={{marginLeft:"auto",display:"flex",gap:3,background:"rgba(255,255,255,0.04)",borderRadius:9,padding:3}}>
          {[
            ["vocab",   `📜 Vocabulary (${vocabCards.length})`,    "rgba(200,160,60,0.15)",  "rgba(200,160,60,0.3)",  "#e8c060"],
            ["grammar", `🏛 Grammar & Culture (${grammarCards.length})`, "rgba(140,110,200,0.15)", "rgba(140,110,200,0.3)", "#c0a8f0"],
            ["quiz",    `⚡ Practice Quiz (${practiceQuestions.length})`,  "rgba(60,160,120,0.15)",  "rgba(60,160,120,0.3)",  "#60d0a0"],
          ].map(([m, label, bg, bord, col]) => (
            <button key={m} onClick={()=>setMode(m)} style={{all:"unset",cursor:"pointer",padding:"6px 18px",borderRadius:7,fontFamily:"'Crimson Text',Georgia,serif",fontSize:13,fontWeight:600,transition:"all 0.2s",
              background:mode===m ? bg : "transparent",
              color:mode===m ? col : "#5a4a38",
              border:mode===m ? `1px solid ${bord}` : "1px solid transparent"}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      {/* CONTENT */}
      {mode === "vocab" ? <VocabDeck /> : mode === "grammar" ? <GrammarDeck /> : <QuizMode />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(NLEApp));

  </script>
</body>
